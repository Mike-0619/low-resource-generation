# Run and model
seed: 42
model_id: "unsloth/Llama-3.2-3B-Instruct"

# Generation
batch_size: 96
max_new_tokens: 64
max_input_length: 512

# ParaPLUIE scoring
with_parapluie: false  # Enable scoring during generation.
judge_model_id: "mistralai/Mistral-7B-Instruct-v0.2"

# Default prompt for a single benchmark run
prompt_type: "few_shot"

# Report paths by prompt
runs:
  simple_zero_shot:
    report_path: "results/llama3/simple_zero_shot/report.json"
    parapluie_report_path: "results/llama3/simple_zero_shot/report_parapluie.json"

  zero_shot_preserve:
    report_path: "results/llama3/zero_shot_preserve/report.json"
    parapluie_report_path: "results/llama3/zero_shot_preserve/report_parapluie.json"

  few_shot:
    report_path: "results/llama3/few_shot/report.json"
    parapluie_report_path: "results/llama3/few_shot/report_parapluie.json"
