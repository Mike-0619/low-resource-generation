attention_backend: sdpa

protocol: babylm2026_baseline

model:
  vocab_size: 16384
  n_layer: 12
  n_embd: 768
  n_head: 12
  n_positions: 1024
  activation_function: gelu_new
  initializer_range: 0.02
  layer_norm_epsilon: 0.00001
  attn_pdrop: 0.1
  resid_pdrop: 0.1
  embd_pdrop: 0.1
  tie_word_embeddings: true

training:
  sequence_length: 512
  epochs: 10
  batch_size: 16
  learning_rate: 0.00005
  weight_decay: 0.0
  adam_beta1: 0.9
  adam_beta2: 0.999
  adam_epsilon: 0.00000001
  gradient_clip_norm: 1.0
  warmup_fraction: 0.01
  seed: 42
  words_per_epoch: 10791084

dataset:
  size: 10M
  language: German
  repo_id: BabyLM-community/babylm-deu
  revision: 69ff474c64a7e0df3a473b1b5d968a0fc18478ac
  corpus_path: babylm-2026/German/10M
  format: parquet
  files: [child-available-speech.train.parquet, child-books.train.parquet, child-directed-speech.train.parquet, child-news.train.parquet, child-wiki.train.parquet, educational.train.parquet, padding-opensubtitles.train.parquet]
  sources: [child-available-speech, child-books, child-directed-speech, child-news, child-wiki, educational, padding-opensubtitles]
  expected_documents: 4049
  expected_whitespace_tokens: 10791084
  manifest: manifest.json
  sampling: category_word_ten_percent_prefix_v1
