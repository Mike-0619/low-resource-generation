attention_backend: sdpa

protocol: babylm2026_baseline

model:
  vocab_size: 16384
  n_layer: 12
  n_embd: 768
  n_head: 12
  n_positions: 1024
  activation_function: gelu_new
  initializer_range: 0.02
  layer_norm_epsilon: 0.00001
  attn_pdrop: 0.1
  resid_pdrop: 0.1
  embd_pdrop: 0.1
  tie_word_embeddings: true

training:
  sequence_length: 512
  epochs: 10
  batch_size: 16
  learning_rate: 0.00005
  weight_decay: 0.0
  adam_beta1: 0.9
  adam_beta2: 0.999
  adam_epsilon: 0.00000001
  gradient_clip_norm: 1.0
  warmup_fraction: 0.01
  seed: 42
  words_per_epoch: 10000000

dataset:
  size: 10M
  language: Turkish
  repo_id: BabyLM-community/babylm-tur
  revision: 30dd54383ae7fac713add39889d2311e8eb350ec
  corpus_path: babylm-2026/Turkish/10M
  format: parquet
  files: [child-directed-speech.train.parquet, child-books.train.parquet, padding-wikipedia.train.parquet, padding-fineweb-c.train.parquet, padding-turmix.train.parquet]
  sources: [child-directed-speech, child-books, padding-wikipedia, padding-fineweb-c, padding-turmix]
  expected_documents: 25705
  expected_whitespace_tokens: 10000000
  manifest: manifest.json
  derived_dataset: true
