[project]
name = "low-resource-generation"
version = "0.1.0"
description = "LAMBADA evaluation with local GPT-2/LLaMA3 and GPT-5.6 Luna"
requires-python = ">=3.14,<3.15"
dependencies = [
    "torch==2.14.0+cu132",
    "transformers==5.17.0",
    "accelerate==1.15.0",
    "huggingface-hub==1.33.0",
    "safetensors==0.8.0",
    "sentencepiece==0.2.2",
    "datasets==5.0.1",
    "tqdm==4.70.1",
    "openai>=2.0",
]

[tool.uv]
package = false
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu132" }

[tool.pytest.ini_options]
addopts = "-p no:cacheprovider"
